name: App prüfen und auf GitHub Pages veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_browser_checks_passed:
        description: Browserprüfungen für diesen Programmstand bereits lokal bestanden
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm run build
        env:
          FOLIO_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: npx playwright install --with-deps chromium webkit
        if: github.event_name != 'workflow_dispatch' || !inputs.local_browser_checks_passed
        timeout-minutes: 5
      - run: npm run test:pages
        if: github.event_name != 'workflow_dispatch' || !inputs.local_browser_checks_passed
        env:
          FOLIO_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Bereits lokal geprüfter Stand
        if: github.event_name == 'workflow_dispatch' && inputs.local_browser_checks_passed
        run: printf '%s\n' 'Manueller Lauf nach bereits bestandenen lokalen Browserprüfungen. Kernprüfungen und Produktionsbuild laufen auch hier vollständig.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
